name: Morpho CI

on:
  push:
    paths:
      - "morpho/**"
      - ".github/workflows/morpho-ci.yml"
  pull_request:
    paths:
      - "morpho/**"
      - ".github/workflows/morpho-ci.yml"

jobs:
  engine:
    name: Engine (JVM) — build & tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and test engine
        working-directory: morpho/engine
        run: ./gradlew build

      # The README states how many tests the engine has, and a number kept
      # by hand goes stale in silence. Three README edits have already been
      # abandoned half-written for asserting a count that an earlier commit
      # the same day had moved, and a stale number in the one document that
      # explains this project is worse than no number. The build counts
      # them and says so.
      - name: The README's test count is the number of tests
        working-directory: morpho
        run: |
          set -uo pipefail
          counted=$(find engine -path '*/build/test-results/test/*.xml' -exec \
            grep -ho 'tests="[0-9]*"' {} + | grep -o '[0-9]*' | awk '{s+=$1} END {print s+0}')
          if [ -z "${counted:-}" ] || [ "$counted" = "0" ]; then
            echo "::error::Found no test results to count. The build layout changed — fix this guard, never skip it."
            exit 1
          fi
          said=$(grep -o '\*\*Engine ([0-9]* tests):\*\*' README.md | grep -o '[0-9]*' || true)
          if [ -z "$said" ]; then
            echo "::error::README.md no longer states the engine's test count in the shape this guard reads. Restore it or fix the guard."
            exit 1
          fi
          if [ "$said" != "$counted" ]; then
            echo "::error::README.md says $said engine tests; the build ran $counted. Update the README."
            exit 1
          fi
          echo "README.md and the build agree: $counted engine tests."

  android:
    name: Android app — assemble & lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Assemble debug and run lint
        working-directory: morpho/android
        run: ./gradlew :app:assembleDebug :app:lintDebug

      # The launch artifact, built on every push: release runs R8 over code
      # that debug never touches, and a keep rule that is missing there fails
      # only in the hands of users. Unsigned here — signing needs a keystore
      # that deliberately lives outside the repository.
      - name: Assemble release bundle (R8 + resource shrinking)
        working-directory: morpho/android
        run: ./gradlew :app:assembleRelease :app:bundleRelease

      # The Zero-Upload guarantee is a product promise, so it is checked by a
      # machine rather than by memory: the merged manifest is what actually
      # ships, and it includes every permission any dependency asks for.
      - name: Zero-Upload guard — no network permission may reach the manifest
        working-directory: morpho/android
        run: |
          set -uo pipefail
          manifests=$(find app/build/intermediates -name AndroidManifest.xml -path '*merged*' 2>/dev/null || true)
          if [ -z "$manifests" ]; then
            manifests=$(find app/build -name AndroidManifest.xml 2>/dev/null || true)
          fi
          if [ -z "$manifests" ]; then
            echo "::error::Zero-Upload guard found no merged manifest to inspect. The build layout changed — fix the guard, never skip it."
            exit 1
          fi
          echo "Inspecting merged manifests:"
          echo "$manifests"
          if grep -Hn -E 'android\.permission\.(INTERNET|ACCESS_NETWORK_STATE|ACCESS_WIFI_STATE)' $manifests; then
            echo "::error::A network permission reached the merged manifest. Morpho converts documents with no network access at all; if a dependency introduced this, remove it in the app manifest with tools:node=\"remove\" or drop the dependency."
            exit 1
          fi
          echo "No network permissions in the merged manifest — the Zero-Upload guarantee holds."
