name: Morpho CI

on:
  push:
    paths:
      - "morpho/**"
      - ".github/workflows/morpho-ci.yml"
  pull_request:
    paths:
      - "morpho/**"
      - ".github/workflows/morpho-ci.yml"

jobs:
  engine:
    name: Engine (JVM) — build & tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and test engine
        working-directory: morpho/engine
        run: ./gradlew build

  android:
    name: Android app — assemble & lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Assemble debug and run lint
        working-directory: morpho/android
        run: ./gradlew :app:assembleDebug :app:lintDebug
